<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBuilder - Build Compare</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-page {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(100, 150, 220, 0.15);
        }
        .compare-page h1 {
            font-size: 24px;
            color: #1a5fa8;
            margin-bottom: 24px;
        }
        .compare-inputs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }
        .compare-input-group {
            flex: 1;
        }
        .compare-input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }
        .compare-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: monospace;
        }
        .compare-input-group input:focus {
            outline: none;
            border-color: #1a5fa8;
        }
        .compare-run-btn {
            background: #1a5fa8;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .compare-run-btn:hover {
            background: #164d8a;
        }
        .compare-result {
            margin-top: 24px;
            border-top: 1px solid #eee;
            padding-top: 24px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #1a5fa8;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="compare-page">
            <a href="/" class="back-link">← 返回首页</a>
            <h1>🔍 Build Compare</h1>

            <div class="compare-inputs">
                <div class="compare-input-group">
                    <label for="left-id">Build ID 1 (左)</label>
                    <input type="text" id="left-id" placeholder="例如: 20260511_142159" value="">
                </div>
                <div class="compare-input-group">
                    <label for="right-id">Build ID 2 (右)</label>
                    <input type="text" id="right-id" placeholder="例如: 20260511_141319" value="">
                </div>
            </div>

            <button class="compare-run-btn" onclick="runCompare()">比较</button>

            <div id="compare-result" class="compare-result" style="display:none;"></div>
        </div>
    </div>

    <script>
const API_BASE = '';

// Get params from URL
const params = new URLSearchParams(window.location.search);
const leftId = params.get('left');
const rightId = params.get('right');

if (leftId) document.getElementById('left-id').value = leftId;
if (rightId) document.getElementById('right-id').value = rightId;

async function fetchCompare(leftId, rightId) {
    const res = await fetch(`${API_BASE}/api/builds/compare?left=${encodeURIComponent(leftId)}&right=${encodeURIComponent(rightId)}`);
    if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Compare failed (${res.status})`);
    }
    return res.json();
}

async function runCompare() {
    const leftId = document.getElementById('left-id').value.trim();
    const rightId = document.getElementById('right-id').value.trim();
    const resultDiv = document.getElementById('compare-result');
    const btn = document.querySelector('.compare-run-btn');

    if (!leftId || !rightId) {
        alert('请输入两个 Build ID');
        return;
    }

    btn.disabled = true;
    btn.textContent = '比较中...';
    resultDiv.style.display = 'none';

    try {
        const data = await fetchCompare(leftId, rightId);
        renderCompareResult(data, resultDiv);
        resultDiv.style.display = 'block';
    } catch (err) {
        resultDiv.innerHTML = `<div class="compare-error" style="color:red;">${err.message}</div>`;
        resultDiv.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = '比较';
    }
}

function renderCompareResult(data, container) {
    const { left, right, summary, repo_comparisons } = data;

    const statusColors = {
        unchanged:  '#d4edda',
        modified:   '#fff3cd',
        left_only:  '#f8d7da',
        right_only: '#f8d7da',
    };
    const statusTextColors = {
        unchanged:  '#155724',
        modified:   '#856404',
        left_only:  '#721c24',
        right_only: '#721c24',
    };
    const GREEN = '#d4edda';
    const RED = '#f8d7da';
    const GREEN_TEXT = '#155724';
    const RED_TEXT = '#721c24';

    let html = `<div style="margin-bottom:24px;">`;

    // Left/Right header
    html += `<div style="display:flex;gap:12px;margin-bottom:20px;">
        <div style="flex:1;padding:14px 16px;background:#e8f4ff;border-radius:8px;font-weight:bold;font-size:15px;">
            &larr; 左: <span style="font-family:monospace;">${left.id}</span>
        </div>
        <div style="flex:1;padding:14px 16px;background:#e8f4ff;border-radius:8px;font-weight:bold;font-size:15px;">
            &rarr; 右: <span style="font-family:monospace;">${right.id}</span>
        </div>
    </div>`;

    // Comparison rows - each dimension on its own row
    const compareRows = [
        { label: 'Project', leftVal: left.project, rightVal: right.project, same: summary.same_project },
        { label: 'Platform', leftVal: left.platform, rightVal: right.platform, same: summary.same_platform },
        { label: 'Mode', leftVal: left.mode, rightVal: right.mode, same: summary.same_mode },
    ];

    html += '<div>';
    for (const row of compareRows) {
        const bg = row.same ? GREEN : RED;
        const fg = row.same ? GREEN_TEXT : RED_TEXT;
        html += `<div style="display:flex;align-items:center;padding:12px 16px;margin-bottom:8px;border-radius:8px;background:${bg};color:${fg};">
            <div style="width:40px;text-align:center;font-size:20px;">${row.same ? '&check;' : '&times;'}</div>
            <div style="width:120px;font-weight:600;">${row.label}</div>
            <div style="flex:1;font-family:monospace;">${row.leftVal}</div>
            <div style="flex:1;font-family:monospace;">${row.rightVal}</div>
        </div>`;
    }
    html += '</div>';

    if (repo_comparisons.length > 0) {
        html += '<div style="margin-top:16px;"><strong>Repo 对比:</strong>';
        for (const repo of repo_comparisons) {
            const bg = statusColors[repo.status] || '#f0f0f0';
            const fg = statusTextColors[repo.status] || '#333';
            if (repo.status === 'modified') {
                const arrow = (repo.left_commit || '').slice(0, 7) + ' → ' + (repo.right_commit || '').slice(0, 7);
                const ghUrl = repo.github_compare_url || '';
                const nameHtml = ghUrl
                    ? `<a href="${ghUrl}" target="_blank" style="color:#1a5fa8;text-decoration:none;font-weight:500;">${repo.name} ↗</a>`
                    : `<span style="font-weight:500;">${repo.name}</span>`;
                html += `<div style="margin-top:8px;">
                    <div style="display:flex;justify-content:space-between;padding:10px 12px;border-radius:6px;background:${bg};color:${fg};">
                        ${nameHtml}
                        <span>modified (${arrow})</span>
                    </div>`;
                // Show commit diff from local git
                const commits = repo.commits_diff || [];
                if (commits.length > 0) {
                    html += '<div style="margin-left:20px;margin-top:6px;border-left:3px solid #b3d9ff;padding-left:12px;">';
                    for (const c of commits) {
                        const dirColor = c.direction === 'newer' ? '#155724' : '#721c24';
                        const dirLabel = c.direction === 'newer' ? '↑' : '↓';
                        html += `<div style="display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:13px;">
                            <span style="color:${dirColor};font-weight:bold;">${dirLabel}</span>
                            <span style="font-family:monospace;color:#555;">${c.hash}</span>
                            <span style="color:#444;">${escapeHtml(c.message)}</span>
                        </div>`;
                    }
                    html += '</div>';
                }
                if (ghUrl) {
                    html += `<div style="margin-left:20px;padding:6px 0;">
                        <a href="${ghUrl}" target="_blank" style="font-size:13px;color:#3a7fc4;text-decoration:none;">
                            🔗 在 GitHub 上查看完整对比 →
                        </a>
                    </div>`;
                }
                html += '</div>';
            } else {
                let detail = repo.status;
                if (repo.status === 'left_only') {
                    detail += ' (' + (repo.left_commit || '').slice(0, 7) + ')';
                } else if (repo.status === 'right_only') {
                    detail += ' (' + (repo.right_commit || '').slice(0, 7) + ')';
                }
                html += `<div style="display:flex;justify-content:space-between;padding:10px 12px;margin-top:8px;border-radius:6px;background:${bg};color:${fg};">
                    <span style="font-weight:500;">${repo.name}</span>
                    <span>${detail}</span>
                </div>`;
            }
        }
        html += '</div>';
    } else {
        html += '<div style="margin-top:16px;color:#666;">无 repo 数据可比较</div>';
    }

    container.innerHTML = html;
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}
    </script>
</body>
</html>
