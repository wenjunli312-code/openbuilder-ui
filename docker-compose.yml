services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend/downloads:/app/downloads
      - ./frontend:/frontend
      - ~/workspace/openbuilder-workspace:/Users/kaka/workspace/openbuilder-workspace
      - ~/workspace/code/openbuilder:/root/workspace/code/openbuilder
      - ./backend/builds.json:/app/builds.json
      # Docker socket to run dockcross containers from within backend
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=development
      - TZ=Asia/Shanghai
      - WORKSPACE_DIR=/Users/kaka/workspace/openbuilder-workspace
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
